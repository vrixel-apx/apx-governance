# APX payment platform governance manifest, read by the Vrixel agentic SDLC tool.
# Changes are pull requests approved by the product owner (see CODEOWNERS).
# The tool rejects values that loosen platform limits.
product_id: APX
name: APX payment platform
constitution: constitution.md
context: context.md
# Lanes this product builds on. Their repos may join this product's change sets, their
# constitutions apply to changes in their repos, and their owners co-approve G4 to G6.
depends_on: [SS]
# Runtime infrastructure stays with the product: shared services run inside it.
runtime:
  openchoreo_project: apx
  pipeline: [dev, staging, production]
budget_usd: 200
critic_threshold: 0.85
max_loops: 3
# No repos yet: the first feature's design proposes them, G4 approves them and the provision
# step creates them, named apx-<name>.
repos: []
repo_prefix: apx-
approvers:
  g1:
  - apx-product-owner
  g2:
  - apx-product-owner
  g3:
  - apx-design-lead
  g4:
  - apx-architect
  g5:
  - apx-tech-lead
  g6:
  - apx-release-manager
high_risk_paths:
- src/ledger/
- src/rails/
- migrations/
